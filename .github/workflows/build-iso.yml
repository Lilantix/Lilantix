name: Build Lilantix ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y debootstrap squashfs-tools genisoimage rsync isolinux syslinux-utils

    - name: Prepare Debian Base (SysVinit + Kernel)
      run: |
        mkdir -p build/rootfs
        sudo debootstrap stable build/rootfs http://ftp.us.debian.org/debian/ \
          --include=sysvinit-core,sysvinit-utils,linux-image-amd64,initramfs-tools,sudo
        
    - name: Customize System (The Lilantix Touch)
      run: |
        # Copy scripts ke dalam sistem target
        sudo cp scripts/mate build/rootfs/usr/local/bin/
        sudo cp scripts/run-as-root build/rootfs/usr/local/bin/
        sudo chmod +x build/rootfs/usr/local/bin/mate
        sudo chmod +x build/rootfs/usr/local/bin/run-as-root

        # Copy konfigurasi IceWM
        sudo mkdir -p build/rootfs/etc/icewm
        sudo cp config/icewm/* build/rootfs/etc/icewm/

        # Jalankan pembersihan bloatware dan instalasi DE di dalam chroot
        sudo chroot build/rootfs /bin/bash -c '
          echo "deb http://ftp.us.debian.org/debian stable main" > /etc/apt/sources.list
          apt-get update
          apt-get install -y icewm xorg xterm pcmanfm falkon zenity
          apt-get purge -y firefox-esr libreoffice* cups* transmission-gtk
          apt-get autoremove -y
          apt-get clean
        '

    - name: Prepare ISO Structure & Bootloader
      run: |
        # Membuat struktur direktori ISO
        mkdir -p build/iso/{boot/isolinux,live}
        
        # Copy bootloader files
        cp /usr/lib/ISOLINUX/isolinux.bin build/iso/boot/isolinux/
        cp /usr/lib/syslinux/modules/bios/*.c32 build/iso/boot/isolinux/
        
        # Membuat konfigurasi boot (isolinux.cfg) dengan cara yang aman untuk YAML
        cat > build/iso/boot/isolinux/isolinux.cfg << 'ENDCFG'
UI menu.c32
PROMPT 0
TIMEOUT 50
DEFAULT lilantix

MENU TITLE Lilantix Live System

LABEL lilantix
MENU LABEL Boot Lilantix
KERNEL /live/vmlinuz
APPEND initrd=/live/initrd.img boot=live quiet splash
ENDCFG

        # Copy kernel dan initrd dari rootfs ke live folder
        sudo cp build/rootfs/boot/vmlinuz-* build/iso/live/vmlinuz
        sudo cp build/rootfs/boot/initrd.img-* build/iso/live/initrd.img

    - name: Build SquashFS & ISO
      run: |
        # Membuat filesystem.squashfs
        sudo mksquashfs build/rootfs build/iso/live/filesystem.squashfs -comp gzip
        
        # Membuat ISO final
        genisoimage -o Lilantix.iso \
          -b boot/isolinux/isolinux.bin \
          -c boot/isolinux/boot.cat \
          -no-emul-boot \
          -boot-load-size 4 \
          -boot-info-table \
          -R -J -V "Lilantix" \
          build/iso

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Lilantix-ISO
        path: Lilantix.iso
